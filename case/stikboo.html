<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stikboo | Adaikem Ajufo</title>
<meta name="description" content="Stikboo: an NFT collection product.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400,100;1,9..144,400,100&family=Manrope:wght@400;500;600;700&family=EB+Garamond:ital@0;1&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tiny5&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../v3.css">
<style>
/* Stikboo: a visual showcase, not a case study. Images stacked with one small caption each. */
.sb-cap{display:flex;gap:12px;align-items:baseline;margin:-22px 6px 8px;font-size:14px;line-height:1.5;color:rgba(255,255,255,.62)}
.sb-cap b{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#D4FF4A;flex:none}
@media (max-width:600px){.sb-cap{margin:-8px 4px 6px;font-size:13px;gap:10px}.sb-cap b{font-size:10px}}
.sb-run{position:absolute;left:10.278%;top:.657%;width:79.722%;height:3.829%;overflow:hidden;pointer-events:none;background:linear-gradient(90deg,#14121e,#0d0a1b)}
.sb-run .tr{display:flex;height:100%;width:max-content;animation:sbrun 22s linear infinite}
.sb-run .tr img{height:100%;width:auto;display:block;max-width:none}
@keyframes sbrun{to{transform:translateX(-50%)}}

/* Oct 19 2026 her ask: Stikboo page type + accents follow Stikboo's own brand (Tiny5 pixel display + Space Grotesk body; acid lime #D4FF4A, cyan #7DF9FF on near-black, from the Stikboo design source), not the portfolio lilac/serif. Nav + footer keep the portfolio look. */
body[data-slug="stikboo"] main.case{--lilac:#D4FF4A;--serif:"Space Grotesk","Manrope",sans-serif;--sk-lime:#D4FF4A;--sk-cyan:#7DF9FF;--sk-soft:#A79FC4}
body[data-slug="stikboo"] main.case .case-foot{--lilac:#C4A0FF;--serif:"Fraunces",Georgia,serif}
body[data-slug="stikboo"] .case-title{font-family:"Tiny5",monospace;font-weight:400;letter-spacing:.02em;font-variation-settings:normal;line-height:1;text-transform:uppercase}
body[data-slug="stikboo"] .case-lede{font-family:"Space Grotesk",sans-serif;font-weight:500;letter-spacing:-.01em;font-variation-settings:normal}
body[data-slug="stikboo"] .case-desc,body[data-slug="stikboo"] .sb-cap span{font-family:"Space Grotesk","Manrope",sans-serif}
body[data-slug="stikboo"] .case-hero .brand,body[data-slug="stikboo"] .next .brand{font-family:"Tiny5",monospace;color:var(--sk-lime);letter-spacing:.12em}
body[data-slug="stikboo"] .case-meta .foot-label{font-family:"Tiny5",monospace;letter-spacing:.14em}
body[data-slug="stikboo"] .badge{font-family:"Space Grotesk",sans-serif}
body[data-slug="stikboo"] .back:hover{color:var(--sk-lime)}
body[data-slug="stikboo"] .next-title{font-family:"Space Grotesk",sans-serif;font-weight:600;font-variation-settings:normal}
body[data-slug="stikboo"] .next-title i{color:var(--sk-lime)}
body[data-slug="stikboo"] .sb-cap b{font-family:"Tiny5",monospace;font-size:13px;letter-spacing:.12em}
@media (max-width:600px){body[data-slug="stikboo"] .sb-cap b{font-size:12px}}
</style>
<link rel="icon" href="../assets/logo.jpg">
<meta property="og:title" content="Stikboo | Adaikem Ajufo">
<meta property="og:image" content="https://techboo-portfolio-preview.sites.tab.bot/assets/cases/stikboo/cover.webp">
</head>
<body class="case-page tb-site" data-base="../" data-slug="stikboo">
<header class="nav">
  <a class="nav-brand" href="../">
    <span class="nav-name"><span id="nav-first"></span> <em id="nav-last"></em></span>
    <span class="nav-role" id="nav-role"></span>
  </a>
  <div class="nav-right"><div class="nav-time" id="nav-time"></div></div>
</header>
<main class="case" id="case"></main>
<script src="../content.js"></script>
<script src="../tabs.js"></script>
<script src="../vparts.js"></script>
<script src="../case.js"></script>
<script>
/* Stikboo: one small caption under each board rendered by case.js */
(function(){
  var gal = document.querySelector("#case .case-gallery"); if(!gal) return;
  var figs = gal.querySelectorAll(".case-module");
  var caps = [
    ["Landing", "Under the hero: the recolours, the story, what holding means and the invite-only whitelist."],
    ["The crew", "The one glass section, where the recolours line up."],
    ["Traits, team, FAQ", "Every trait is drawn on the same 64 pixel grid as the original."],
    ["Mint", "Wallet check, phases, quantity and one big button, plus every button state."],
    ["Mobile", "The landing on a phone."],
    ["Mobile", "The mint on a phone."],
    ["Mint flow", "Pick a quantity, mint, and the piece reveals."]
  ];
  for(var i=0;i<figs.length && i<caps.length;i++){
    var p = document.createElement("p"); p.className = "sb-cap";
    p.innerHTML = "<b>" + caps[i][0] + "</b><span>" + caps[i][1] + "</span>";
    figs[i].parentNode.insertBefore(p, figs[i].nextSibling);
  }
})();
</script>
<script>
/* Oct 19 2026 her ask: the recolour row on the landing board moves horizontally */
(function(){
  var img=document.querySelector('#case .case-gallery img[src*="d01-landing"]'); if(!img) return;
  var w=document.createElement('div'); w.style.position='relative';
  img.parentNode.insertBefore(w,img); w.appendChild(img);
  var r=document.createElement('div'); r.className='sb-run';
  r.innerHTML='<div class="tr"><img src="../assets/cases/stikboo/strip.webp" alt=""><img src="../assets/cases/stikboo/strip.webp" alt=""></div>';
  w.appendChild(r);
})();
</script>
</body>
</html>
