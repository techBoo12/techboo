/* Stikboo: a visual showcase, not a case study. Images stacked with one small caption each. */
.sb-cap{display:flex;gap:12px;align-items:baseline;margin:-22px 6px 8px;font-size:14px;line-height:1.5;color:rgba(255,255,255,.62)}
.sb-cap b{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#D4FF4A;flex:none}
@media (max-width:600px){.sb-cap{margin:-8px 4px 6px;font-size:13px;gap:10px}.sb-cap b{font-size:10px}}

    <span class="nav-name"><span id="nav-first"></span> <em id="nav-last"></em></span>

<script src="../vparts.js"></script>
<script src="../case.js"></script>
<script>
/* Stikboo: one small caption under each board rendered by case.js */
(function(){
  var gal = document.querySelector("#case .case-gallery"); if(!gal) return;
  var figs = gal.querySelectorAll(".case-module");
  var caps = [
    ["Landing", "Under the hero: the recolours, the story, what holding means and the invite-only whitelist."],
    ["The crew", "The one glass section, where the recolours line up."],
    ["Traits, team, FAQ", "Every trait is drawn on the same 64 pixel grid as the original."],
    ["Mint", "Wallet check, phases, quantity and one big button, plus every button state."],
    ["Mobile", "The landing on a phone."],
    ["Mobile", "The mint on a phone."],
    ["Mint flow", "Pick a quantity, mint, and the piece reveals."]
  ];
  for(var i=0;i<figs.length && i<caps.length;i++){
    var p = document.createElement("p"); p.className = "sb-cap";
    p.innerHTML = "<b>" + caps[i][0] + "</b><span>" + caps[i][1] + "</span>";
    figs[i].parentNode.insertBefore(p, figs[i].nextSibling);
  }
})();
</script>
